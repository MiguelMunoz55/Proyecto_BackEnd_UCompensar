spring.application.name=api

server.port=8080

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/spechub?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "validate" asume que docs/schema.sql ya creó las tablas en español.
# Usa "update" solo en desarrollo si prefieres que Hibernate genere el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Subida de imágenes de dispositivos ---
# Carpeta donde se guardan los archivos (relativa a donde se ejecuta el backend).
spechub.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

